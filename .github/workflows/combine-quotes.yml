name: Build quote dataset

on:
  push:
    paths:
      - "assets/*.txt"
      - "assets/**/*.txt"
      - "scripts/build-quotes.mjs"
      - "package.json"
      - ".github/workflows/combine-quotes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quote-dataset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Regenerate quote data
        run: |
          npm run data:build
          npm run check

      - name: Commit generated files when changed
        run: |
          if git diff --quiet -- data/quotes.json data/quotes.min.json data/data.log; then
            echo "Generated quote data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json data/quotes.min.json data/data.log
          git commit -m "chore(data): regenerate quote dataset"
          git push
